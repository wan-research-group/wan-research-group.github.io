<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 566 560" fill="none" role="img" aria-label="Illustration: an AI agent co-designing with a stack of systems, architecture, and chips">
  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0b5cc4"/>
    </marker>
    <marker id="arrowLight" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7fb3dd"/>
    </marker>
  </defs>

  <!-- orbit ring -->
  <ellipse cx="260" cy="150" rx="150" ry="52" stroke="#d8e8f4" stroke-width="1.5" stroke-dasharray="3 6"/>

  <!-- ===== the agent ===== -->
  <g>
    <!-- antenna -->
    <line x1="260" y1="88" x2="260" y2="104" stroke="#0b5cc4" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="260" cy="84" r="5" fill="#0b5cc4"/>
    <!-- head -->
    <rect x="222" y="104" width="76" height="64" rx="16" fill="#f2f7fb" stroke="#0b5cc4" stroke-width="2.5"/>
    <!-- eyes -->
    <circle cx="245" cy="132" r="6" fill="#0b5cc4"/>
    <circle cx="275" cy="132" r="6" fill="#0b5cc4"/>
    <!-- smile -->
    <path d="M247 150 Q260 158 273 150" stroke="#0b5cc4" stroke-width="2.5" stroke-linecap="round"/>
    <!-- side sparks -->
    <path d="M206 122 l-8 0 M206 140 l-12 0" stroke="#b9d9eb" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M314 122 l8 0 M314 140 l12 0" stroke="#b9d9eb" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- sparkle accents -->
  <g fill="#0b5cc4">
    <path d="M388 96 l3.5 9 9 3.5 -9 3.5 -3.5 9 -3.5 -9 -9 -3.5 9 -3.5 z" opacity="0.85"/>
    <path d="M128 70 l2.6 6.8 6.8 2.6 -6.8 2.6 -2.6 6.8 -2.6 -6.8 -6.8 -2.6 6.8 -2.6 z" opacity="0.55"/>
    <circle cx="410" cy="210" r="4" fill="#b9d9eb"/>
    <circle cx="104" cy="196" r="4" fill="#b9d9eb"/>
  </g>

  <!-- link from agent to stack -->
  <line x1="260" y1="168" x2="260" y2="238" stroke="#0b5cc4" stroke-width="2" stroke-dasharray="2 6" stroke-linecap="round"/>

  <!-- ===== the stack (bottom-up: chips, architecture, systems) ===== -->
  <!-- chips plate -->
  <g>
    <path d="M110 452 L260 384 L410 452 L260 520 Z" fill="#eaf2fa" stroke="#0b5cc4" stroke-width="2"/>
    <path d="M110 452 L110 464 L260 532 L260 520 Z" fill="#c9dff1" stroke="#0b5cc4" stroke-width="1.5"/>
    <path d="M410 452 L410 464 L260 532 L260 520 Z" fill="#dcebf7" stroke="#0b5cc4" stroke-width="1.5"/>
    <!-- die grid -->
    <path d="M225 436 L260 420 L295 436 L260 452 Z" fill="#0b5cc4" opacity="0.9"/>
    <path d="M225 436 L260 420 M260 452 L295 436" stroke="#eaf2fa" stroke-width="1"/>
    <path d="M186 454 L214 441 L242 454 L214 467 Z" fill="#b9d9eb"/>
    <path d="M278 454 L306 441 L334 454 L306 467 Z" fill="#b9d9eb"/>
  </g>

  <!-- architecture plate -->
  <g>
    <path d="M110 380 L260 312 L410 380 L260 448 Z" fill="#f2f7fb" stroke="#0b5cc4" stroke-width="2" opacity="0.97"/>
    <path d="M110 380 L110 392 L260 460 L260 448 Z" fill="#d5e6f4" stroke="#0b5cc4" stroke-width="1.5"/>
    <path d="M410 380 L410 392 L260 460 L260 448 Z" fill="#e4eff8" stroke="#0b5cc4" stroke-width="1.5"/>
    <!-- PE array -->
    <g fill="#7fb3dd">
      <path d="M234 364 L252 356 L270 364 L252 372 Z"/>
      <path d="M266 378 L284 370 L302 378 L284 386 Z"/>
      <path d="M202 378 L220 370 L238 378 L220 386 Z"/>
      <path d="M234 392 L252 384 L270 392 L252 400 Z"/>
    </g>
  </g>

  <!-- systems plate -->
  <g>
    <path d="M110 308 L260 240 L410 308 L260 376 Z" fill="#f8fbfd" stroke="#0b5cc4" stroke-width="2" opacity="0.97"/>
    <path d="M110 308 L110 320 L260 388 L260 376 Z" fill="#dcebf7" stroke="#0b5cc4" stroke-width="1.5"/>
    <path d="M410 308 L410 320 L260 388 L260 376 Z" fill="#e9f2f9" stroke="#0b5cc4" stroke-width="1.5"/>
    <!-- network nodes -->
    <g>
      <path d="M215 302 L260 282 L305 302 L260 322 Z" fill="none" stroke="#7fb3dd" stroke-width="1.5" stroke-dasharray="3 4"/>
      <circle cx="260" cy="282" r="5" fill="#0b5cc4"/>
      <circle cx="215" cy="302" r="5" fill="#7fb3dd"/>
      <circle cx="305" cy="302" r="5" fill="#7fb3dd"/>
      <circle cx="260" cy="322" r="5" fill="#b9d9eb"/>
    </g>
  </g>

  <!-- plate labels -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" letter-spacing="1.5" fill="#8a93a0">
    <text x="424" y="290">SYSTEMS</text>
    <text x="424" y="362">ARCHITECTURE</text>
    <text x="424" y="434">CHIPS</text>
  </g>

  <!-- ===== the two directions ===== -->
  <!-- left: computing for AI (stack up to agent) -->
  <path d="M96 384 C34 300 60 190 196 128" stroke="#0b5cc4" stroke-width="2.5" fill="none" marker-end="url(#arrowBlue)"/>
  <!-- right: AI for computing (agent down to stack) -->
  <path d="M326 130 C458 190 484 300 424 384" stroke="#7fb3dd" stroke-width="2.5" fill="none" marker-end="url(#arrowLight)"/>

  <!-- direction labels -->
  <g font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="600">
    <text x="18" y="242" fill="#0b5cc4">Computing</text>
    <text x="18" y="259" fill="#0b5cc4">for AI</text>
    <text x="448" y="242" fill="#5a90c2">AI for</text>
    <text x="448" y="259" fill="#5a90c2">Computing</text>
  </g>
</svg>
